# 半径の閾値
threshold: 4000

# ウィンドウサイズ
window_size:
  x: 650
  y: 500

# Inkscape
inkscape: "C:\\Program Files\\Inkscape\\bin\\inkscape.exe"

# 保存先
folder: "C:\\Users\\******\\OneDrive\\Desktop"

# EPS version
eps_ver: "--export-ps-level=2"
# eps_ver: "--export-ps-level=3"

# EPS margin
eps_margin: "--export-margin=20"

# G-code
gcode:
  scale: 0.01
  default_absolute_mode: false
  arc_length_threshold: 0.1

# 名称
mode_label_rcheck: "Rチェック"
mode_label_eps: "EPS変換"

# ファイル移動設定
move_of_file_1:
  label: "CADフォルダへ"

  out_of_folder: "D:\\CAD_start"
  into_folder: "D:\\CAD_end"

  bg_color: "#00a3af"
  str_color: "white"

  ignore:
    - "tool"
    - "readme.txt"
    - "template.sx"

move_of_file_2:
  label: "LASERフォルダへ"

  out_of_folder: "C:\\LaserFile"
  into_folder: "X:\\LaserFile"

  bg_color: "#a1a46d"
  str_color: "white"

  ignore:
    - "tool"
    - "readme.txt"
    - "template.dat"

move_of_file_3:
  label: "CUTフォルダへ"

  out_of_folder: "C:\\CutFile"
  into_folder: "X:\\CutFile"

  bg_color: "#954e2a"
  str_color: "white"

  ignore:
    - "tool"
    - "readme.txt"
    - "template.ard"